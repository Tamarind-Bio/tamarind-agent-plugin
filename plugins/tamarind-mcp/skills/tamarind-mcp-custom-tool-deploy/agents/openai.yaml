interface:
  display_name: "Tamarind MCP Custom Tool Deploy"
  short_description: "Deploy your own repo as a Tamarind tool"
  default_prompt: "Use $tamarind-mcp-custom-tool-deploy to convert this repository into the Tamarind custom-tool format, build it, and publish it once I approve."
dependencies:
  tools:
    - type: "mcp"
      value: "tamarind"
      description: "Authenticated Tamarind Bio MCP server"
      transport: "streamable_http"
      url: "https://mcp.tamarind.bio/mcp"
