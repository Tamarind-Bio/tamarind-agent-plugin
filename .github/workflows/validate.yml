name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Catch drift by testing the minimum plugin contract against the latest release.
      # `click` is installed explicitly, and is NOT a plugin dependency. tamarind-cli
      # 0.3.2 imports `Abort` from `typer._click.exceptions`, which typer 0.27 no longer
      # exports, and falls back to the external `click` package that typer 0.27 no longer
      # pulls in — so a clean `pip install tamarind-cli` yields a CLI where every command
      # exits 1. Installing click restores the supported fallback path so these tests can
      # check what they exist to check: the plugin's documented CLI contract. Remove this
      # once tamarind-cli imports `Abort` from `typer` (2026-08-31).
      - name: Install the latest published Tamarind CLI
        run: >-
          python -m pip install
          tamarind-cli
          click
          pytest PyYAML numpy
      - name: Run plugin and CLI contract tests
        run: python -m pytest --strict-markers
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Compile retained helpers
        run: python -m compileall -q plugins/tamarind-cli/skills plugins/tamarind-mcp/skills
      - name: Run every retained helper from an unrelated directory
        shell: bash
        run: |
          repo="$PWD"
          workdir="$(mktemp -d)"
          cd "$workdir"
          while IFS= read -r script; do
            python "$script" --help >/dev/null
          done < <(find "$repo/plugins/tamarind-cli/skills" "$repo/plugins/tamarind-mcp/skills" \
            -path '*/scripts/*.py' ! -name '_common.py' ! -path '*/_kernel/*' -type f | sort)
